# Local development dependencies only. The credentials below are throwaway
# values that match .env.example; nothing here is used outside a laptop.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `npm run migrate` fails confusingly if it connects before recovery
      # finishes, so wait for pg_isready rather than for the port to open.
      test: ['CMD-SHELL', 'pg_isready -U shortener -d shortener']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Persistence is off on purpose: Redis is an accelerator here, and every
    # fact the product depends on survives losing it entirely.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
