openapi: 3.1.0
info:
  title: URL Shortener
  version: 0.1.0
  description: >
    Authenticated short-link creation, public 302 redirect, and per-link click
    stats. Takedown is specified in a later story.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: Process is running. Does not check dependencies.
  /ready:
    get:
      summary: Readiness
      description: >
        Returns 200 only when PostgreSQL and Redis both answer a ping.
        A 503 names the dependency that failed. Stop a container to verify:
        `docker compose stop postgres` then curl /ready.
      responses:
        '200':
          description: Both dependencies are reachable.
        '503':
          description: One or both dependencies are down. Body names postgres and redis as ok or down.
  /{code}:
    get:
      summary: Redirect to the destination
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        '302':
          description: Live mapping. Never 301. Not cached by intermediaries.
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
                enum: ['private, no-store']
        '404':
          description: Unknown, expired, deleted, malformed, or reserved code. Bodies are identical.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Redirect rate limit exceeded. Retry-After is seconds until the window resets.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/urls:
    post:
      summary: Create a short URL
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlRequest'
      responses:
        '201':
          description: Mapping persisted.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUrl'
        '400':
          description: Invalid body, rejected destination, or expiresAt in the past.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, unknown, or revoked API key. Bodies are identical.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency-Key reused with a different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Create rate limit exceeded for this API key. Retry-After is seconds until the window resets.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Short-code allocation exhausted after three collisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/urls/{code}:
    get:
      summary: Read URL metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        '200':
          description: Mapping exists (including expired). Soft-deleted is 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlMetadata'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or soft-deleted code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Take down a short URL
      description: >
        Soft-deletes the mapping: the row and its click history are retained.
        The cache entry is removed before 204 so the next redirect is 404.
        Repeating the call is 204. A failed cache invalidation is 500, not 204.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
      responses:
        '204':
          description: Link is deleted (or already was).
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Row is deleted but cache invalidation failed; retry the delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/urls/{code}/stats:
    get:
      summary: Read click stats for a short URL
      description: >
        Any valid API key may read stats for any existing code, including
        soft-deleted links (audit). The default window is the last 30 UTC days
        including today.
        Pass `days` (1–90) to change the window. Per-day counts are aggregated
        in SQL with GROUP BY, not in application memory, and `clicksByDay` is
        sparse: a day with no clicks is absent rather than reported as zero.
        `totalClicks` and `lastClickedAt` describe the requested window, not
        the lifetime of the link.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 7
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Totals and per-day series for the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlStats'
        '400':
          description: Invalid `days` query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown or soft-deleted code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateUrlRequest:
      type: object
      required: [originalUrl]
      properties:
        originalUrl:
          type: string
          maxLength: 2048
        expiresAt:
          type: string
          format: date-time
    CreatedUrl:
      type: object
      required: [code, shortUrl, originalUrl, expiresAt]
      properties:
        code:
          type: string
          minLength: 7
          maxLength: 7
        shortUrl:
          type: string
          format: uri
        originalUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          nullable: true
    UrlStats:
      type: object
      required: [code, totalClicks, lastClickedAt, clicksByDay]
      properties:
        code:
          type: string
        totalClicks:
          type: integer
          minimum: 0
        lastClickedAt:
          type: string
          format: date-time
          nullable: true
        clicksByDay:
          type: array
          items:
            type: object
            required: [date, clicks]
            properties:
              date:
                type: string
                format: date
              clicks:
                type: integer
    UrlMetadata:
      type: object
      required: [code, shortUrl, originalUrl, expiresAt, createdAt]
      properties:
        code:
          type: string
          minLength: 7
          maxLength: 7
        shortUrl:
          type: string
          format: uri
        originalUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
